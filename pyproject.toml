[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpu-rtx"
version = "0.3.0"
description = "TPU-RTX: Zero-Copy RTX-Class Ray Tracing, Multi-Bounce Path Tracing, 3DGS, OpenUSD/Blender Compiler & Physical AI Rendering natively on Google Cloud TPU v5p"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "jax>=0.6.0",
    "flax>=0.10.0",
    "optax>=0.2.0",
    "mujoco>=3.2.0",
    "mujoco-mjx>=3.2.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "trimesh>=4.0.0",
]

[project.optional-dependencies]
usd = ["usd-core>=24.08"]

[tool.setuptools.packages.find]
include = ["tpu_mjx_render*", "tpu_rtx*"]
