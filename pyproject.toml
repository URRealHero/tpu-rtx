[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpu-rtx"
version = "0.3.0"
description = "Native ray tracing, path tracing, 3DGS, OpenUSD/Blender compilation, and differentiable Physical AI rendering on Google Cloud TPU v5p"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Feiyang Liu" }]
dependencies = [
    "jax>=0.6.0",
    "flax>=0.10.0",
    "optax>=0.2.0",
    "mujoco>=3.2.0",
    "mujoco-mjx>=3.2.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "trimesh>=4.0.0",
]

[project.optional-dependencies]
usd = ["usd-core>=24.08"]

[project.urls]
Homepage = "https://zaychikliu.github.io/tpu-rtx/"
Repository = "https://github.com/ZaychikLiu/tpu-rtx"

[tool.setuptools.packages.find]
include = ["tpu_mjx_render*", "tpu_rtx*"]
